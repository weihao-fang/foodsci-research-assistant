name: 错误报告
description: 提交一个可复现的安装、科研规则或计算问题
body:
  - type: input
    id: version
    attributes:
      label: FoodSci版本与宿主版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小脱敏输入、调用步骤与实际输出
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果和可公开核对的依据
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已移除密钥、个人信息、未发表全文及合作方保密资料
          required: true
