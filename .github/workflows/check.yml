name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s skills/foodsci-research-assistant/tests -v
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/build.py
      - run: python -B tools/validate.py
